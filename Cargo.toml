[workspace]
resolver = "2"
members = ["crates/core", "crates/init", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
vcontainer-core = { path = "crates/core" }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_core_09 = { package = "rand_core", version = "0.9", features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
